plugins {
    id 'net.neoforged.gradle.userdev' version '7.0.120'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

// Workaround for ASM conflict: Shadow plugin brings ASM 9.5 on classpath, NeoForge needs ASM 9.8 on module path
// This is a known incompatibility. For run tasks, we create a separate configuration without Shadow's ASM
configurations {
    // Configuration for run tasks that excludes ASM
    runClasspath {
        extendsFrom runtimeClasspath
        exclude group: 'org.ow2.asm'
        exclude group: 'org.objectweb.asm'
    }
    shadow {
        extendsFrom runtimeClasspath
        exclude group: 'org.ow2.asm'
        exclude group: 'org.objectweb.asm'
        exclude group: 'io.netty'
        exclude group: 'org.apache.logging.log4j'
        // Exclude transitive dependencies that conflict with Java module system
        // Note: NeoForge is kept for compilation but excluded from jar via file patterns
        exclude group: 'com.mojang', module: 'brigadier'
        exclude group: 'com.google.j2objc', module: 'j2objc-annotations'
        exclude group: 'com.sun.jna'
        exclude group: 'org.spongepowered', module: 'mixin'
    }
    runtimeClasspath {
        exclude group: 'org.ow2.asm'
        exclude group: 'org.objectweb.asm'
        exclude group: 'io.netty'
        exclude group: 'org.apache.logging.log4j'
    }
}

version = '3.0'
group = 'com.technicjelle'
archivesBaseName = 'BlueMapOfflinePlayerMarkers'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        name = 'BlueColored'
        url = 'https://repo.bluecolored.de/releases'
    }
    maven {
        name = 'Jitpack'
        url = 'https://jitpack.io'
    }
    mavenCentral()
}

dependencies {
    implementation 'net.neoforged:neoforge:21.1.217'
    
    // BlueMap API (provided at runtime, but needed for testing)
    compileOnly 'de.bluecolored.bluemap:BlueMapAPI:2.7.2'
    // For test runs, we need it at runtime too
    testImplementation 'de.bluecolored.bluemap:BlueMapAPI:2.7.2'
    
    // Utilities - exclude transitive dependencies that conflict with module system
    implementation('com.technicjelle:UpdateChecker:2.5.1') {
        exclude group: 'com.mojang', module: 'brigadier'
        exclude group: 'com.google.j2objc', module: 'j2objc-annotations'
        exclude group: 'com.sun.jna', module: 'jna'
        exclude group: 'com.sun.jna', module: 'jna-platform'
        exclude group: 'org.spongepowered', module: 'mixin'
        exclude group: 'net.neoforged', module: 'fml'
    }
    implementation('com.technicjelle:BMUtils:4.2.1') {
        exclude group: 'com.mojang', module: 'brigadier'
        exclude group: 'com.google.j2objc', module: 'j2objc-annotations'
        exclude group: 'com.sun.jna', module: 'jna'
        exclude group: 'com.sun.jna', module: 'jna-platform'
        exclude group: 'org.spongepowered', module: 'mixin'
        exclude group: 'net.neoforged', module: 'fml'
    }
    implementation('com.technicjelle:MCUtils:2.0') {
        exclude group: 'com.mojang', module: 'brigadier'
        exclude group: 'com.google.j2objc', module: 'j2objc-annotations'
        exclude group: 'com.sun.jna', module: 'jna'
        exclude group: 'com.sun.jna', module: 'jna-platform'
        exclude group: 'org.spongepowered', module: 'mixin'
        exclude group: 'net.neoforged', module: 'fml'
    }
    
    // BlueNBT - exclude transitive dependencies that conflict with module system
    implementation('de.bluecolored.bluenbt:BlueNBT:2.3.0') {
        exclude group: 'com.mojang', module: 'brigadier'
        exclude group: 'com.google.j2objc', module: 'j2objc-annotations'
        exclude group: 'com.sun.jna', module: 'jna'
        exclude group: 'com.sun.jna', module: 'jna-platform'
        exclude group: 'org.spongepowered', module: 'mixin'
        exclude group: 'net.neoforged', module: 'fml'
    }
    
    // Annotations
    implementation 'org.jetbrains:annotations:23.1.0'
    
    // Test dependencies (JUnit 4 for existing tests)
    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'org.hamcrest:hamcrest-core:1.3'
    // Vector3d is from flow-math, needed for tests
    testImplementation 'com.flowpowered:flow-math:1.0.3'
}

// Note: ASM is required by NeoForge but must be on module path, not classpath
// We only exclude it from shadow jar, not from runtime configurations

jar {
    manifest {
        attributes([
            'Specification-Title'     : project.name,
            'Specification-Vendor'    : 'TechnicJelle',
            'Specification-Version'   : project.version,
            'Implementation-Title'    : project.name,
            'Implementation-Vendor'  : 'TechnicJelle',
            'Implementation-Version' : project.version
        ])
    }
}

shadowJar {
    archiveClassifier = ''
    
    // Use a filtered configuration that excludes problematic dependencies
    configurations = [project.configurations.shadow]
    
    // Exclude NeoForge and BlueMap API (provided at runtime)
    exclude 'net/neoforged/**'
    exclude 'META-INF/jarjar/net.neoforged.**'
    exclude 'META-INF/services/net.neoforged.**'
    exclude 'META-INF/services/cpw.mods.**'
    exclude 'META-INF/services/com.mojang.**'
    exclude 'de/bluecolored/bluemap/**'
    
    // Exclude ASM from shadow jar (NeoForge provides it on module path)
    exclude 'org/objectweb/asm/**'
    exclude 'org/ow2/asm/**'
    
    // Exclude packages provided by runtime modules (Java 21 module system conflicts)
    // These must be excluded to prevent module resolution errors
    // Using both forward slashes and explicit patterns to ensure they're caught
    exclude 'com/mojang/**'
    exclude 'com\\mojang\\**'  // Windows path separator
    exclude 'com/google/gson/**'
    exclude 'com/google/errorprone/**'
    exclude 'com/google/j2objc/**'
    exclude 'com\\google\\j2objc\\**'
    exclude 'com/google/thirdparty/**'
    exclude 'com/sun/jna/**'
    exclude 'com\\sun\\jna\\**'
    exclude 'net/jodah/typetools/**'
    exclude 'io/netty/**'
    exclude 'META-INF/io.netty.*'
    exclude 'META-INF/native-image/io.netty/**'
    exclude 'META-INF/maven/io.netty/**'
    exclude 'net/minecrell/terminalconsole/**'
    exclude 'it/unimi/dsi/fastutil/**'
    exclude 'org/checkerframework/**'
    exclude 'org/apache/maven/**'
    exclude 'org/apache/logging/log4j/**'
    exclude 'org/apache/http/**'
    exclude 'javax/annotation/**'
    exclude 'org/joml/**'
    exclude 'org/jline/**'
    exclude 'org/antlr/**'
    exclude 'org/lwjgl/**'
    exclude 'org/openjdk/**'
    exclude 'org/slf4j/**'
    exclude 'org/jetbrains/**'
    exclude 'org/intellij/**'
    exclude 'org/codehaus/**'
    exclude 'org/spongepowered/**'
    exclude 'org\\spongepowered\\**'
    exclude 'META-INF/services/org.spongepowered.**'
    
    // Additional exclusions for specific packages that cause module conflicts
    exclude 'META-INF/versions/**/com/mojang/**'
    exclude 'META-INF/versions/**/com/google/j2objc/**'
    exclude 'META-INF/versions/**/com/sun/jna/**'
    exclude 'META-INF/versions/**/org/spongepowered/**'
    exclude 'META-INF/versions/**/net/neoforged/**'
    
    exclude 'com/ibm/**'
    exclude 'joptsimple/**'
    exclude 'ca/weblite/**'
    exclude 'cpw/mods/**'
    exclude 'mozilla/**'
    exclude 'oshi/**'
    exclude 'com/google/common/**'
    exclude 'net/jpountz/**'
    exclude 'net/minecraft/**'
    exclude 'net/minecraftforge/**'
    exclude 'org/apache/commons/**'
    
    // Ensure we don't include any module-info.class files from excluded packages
    exclude 'module-info.class'
    
    // Use mergeServiceFiles to handle service files properly
    mergeServiceFiles()
    
    // Transform to remove any remaining problematic packages
    transform(com.github.jengelman.gradle.plugins.shadow.transformers.PropertiesFileTransformer) {
        paths = ['META-INF/spring.handlers', 'META-INF/spring.schemas']
        mergeStrategy = "append"
    }
    
    // Note: Relocation disabled due to Java 21 bytecode compatibility issues with Shadow plugin 8.1.1
    // If conflicts occur at runtime, consider updating Shadow plugin or using a different shading approach
    // relocate 'com.technicjelle.BMUtils', "${project.group}.${project.name}.shadow.BMUtils"
    // relocate 'com.technicjelle.MCUtils', "${project.group}.${project.name}.shadow.MCUtils"
    // relocate 'com.technicjelle.UpdateChecker', "${project.group}.${project.name}.shadow.UpdateChecker"
    // relocate 'org.bstats', "${project.group}.${project.name}.shadow.bstats"
    // relocate 'org.spongepowered.configurate', "${project.group}.${project.name}.shadow.configurate"
    
    // Filter out problematic packages using a custom filter
    doFirst {
        // This ensures exclusions are applied
        println "Building shadow JAR with exclusions for module system conflicts"
    }
    
}

// Post-process shadowJar to remove any remaining conflicting packages
task cleanShadowJar {
    dependsOn shadowJar
    description = 'Removes conflicting packages from shadow JAR to fix module system errors'
    
    doLast {
        def shadowJarFile = shadowJar.archiveFile.get().asFile
        def tempJar = file("${buildDir}/tmp/cleanShadowJar/${shadowJarFile.name}")
        
        // Create temp directory
        tempJar.parentFile.mkdirs()
        
        // Use zip filesystem to filter out problematic packages
        // These packages conflict with Java module system at runtime
        def conflictingPackages = [
            'com/mojang/',
            'com/google/j2objc/',
            'com/sun/jna/',
            'org/spongepowered/',
            'net/neoforged/fml/earlydisplay',
            'META-INF/versions/',
            'META-INF/services/com.mojang',
            'META-INF/services/org.spongepowered',
            'META-INF/services/net.neoforged'
        ]
        
        def zipFile = new java.util.zip.ZipFile(shadowJarFile)
        def outputZip = new java.util.zip.ZipOutputStream(new FileOutputStream(tempJar))
        
        try {
            int removed = 0
            zipFile.entries().each { entry ->
                def shouldExclude = false
                def entryName = entry.name
                
                // Check if entry is in a conflicting package
                for (pkg in conflictingPackages) {
                    if (entryName.startsWith(pkg)) {
                        shouldExclude = true
                        removed++
                        break
                    }
                }
                
                // Also exclude module-info.class files
                if (entryName == 'module-info.class') {
                    shouldExclude = true
                    removed++
                }
                
                if (!shouldExclude) {
                    outputZip.putNextEntry(new java.util.zip.ZipEntry(entryName))
                    if (!entry.isDirectory()) {
                        zipFile.getInputStream(entry).withStream { input ->
                            input.transferTo(outputZip)
                        }
                    }
                    outputZip.closeEntry()
                }
            }
            println "Cleaned shadow JAR: removed ${removed} conflicting entries"
        } finally {
            outputZip.close()
            zipFile.close()
        }
        
        // Replace the original shadowJar with the cleaned version
        copy {
            from tempJar
            into shadowJarFile.parentFile
            rename { shadowJarFile.name }
        }
    }
}

// Make the build task use shadowJar instead of regular jar (for distribution)
// But run tasks use the regular jar to avoid Shadow plugin interference
tasks.build.dependsOn cleanShadowJar
tasks.assemble.dependsOn cleanShadowJar

// Ensure run tasks don't depend on shadow jar and use a clean classpath
tasks.matching { it.name.startsWith('run') }.configureEach {
    dependsOn.removeAll { it.name.contains('shadow') }
    // Use runClasspath configuration that excludes ASM
    doFirst {
        // Filter out ASM from classpath
        def classpathFiles = classpath.files.findAll { file ->
            !file.name.contains('asm-tree') && 
            !file.name.contains('asm-') && 
            !file.path.contains('org.ow2.asm') && 
            !file.path.contains('org.objectweb.asm')
        }
        classpath = files(classpathFiles)
    }
}

// NeoForge userdev automatically handles NeoForm configuration

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        
        // Add mod dependencies for test runs
        modSource project.sourceSets.main
    }
    
    client {
        workingDirectory = project.file('run')
    }
    
    server {
        workingDirectory = project.file('run')
        
        // For server testing, we need BlueMap available
        // Note: BlueMap mod must be manually placed in run/mods/ before running
    }
}

// Configure test task (using JUnit 4)
tasks.named('test', Test) {
    useJUnit()
}

// Task to download BlueMap for testing (optional)
task downloadBlueMap(type: Exec) {
    description = 'Downloads BlueMap NeoForge mod for testing'
    group = 'setup'
    
    doFirst {
        println 'Note: Please manually download BlueMap NeoForge version and place it in run/mods/'
        println 'Download from: https://modrinth.com/mod/bluemap/version/latest'
        println 'Or: https://www.curseforge.com/minecraft/mc-mods/bluemap'
    }
}

