plugins {
    id 'net.neoforged.gradle.userdev' version '7.0.120'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

// Workaround for ASM conflict: Shadow plugin brings ASM 9.5 on classpath, NeoForge needs ASM 9.8 on module path
// This is a known incompatibility. For run tasks, we create a separate configuration without Shadow's ASM
configurations {
    // Configuration for run tasks that excludes ASM
    runClasspath {
        extendsFrom runtimeClasspath
        exclude group: 'org.ow2.asm'
        exclude group: 'org.objectweb.asm'
    }
    shadow {
        exclude group: 'org.ow2.asm'
        exclude group: 'org.objectweb.asm'
    }
    runtimeClasspath {
        exclude group: 'org.ow2.asm'
        exclude group: 'org.objectweb.asm'
        exclude group: 'io.netty'
        exclude group: 'org.checkerframework'
        exclude group: 'org.apache.maven'
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'org.apache.logging.log4j'
        exclude group: 'it.unimi.dsi', module: 'fastutil'
        exclude group: 'org.antlr', module: 'antlr4-runtime'
        exclude group: 'com.mojang', module: 'brigadier'
        exclude group: 'com.google.j2objc', module: 'j2objc-annotations'
        exclude group: 'com.electronwill.nightconfig'
        exclude group: 'org.joml'
        exclude group: 'org.spongepowered'
        exclude group: 'org.jline'
        exclude group: 'org.codehaus.plexus'
        exclude group: 'com.mojang', module: 'authlib'
        exclude group: 'com.machinezoo.noexception'
    }
}

version = '3.0'
group = 'com.technicjelle'
archivesBaseName = 'BlueMapOfflinePlayerMarkers'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        name = 'BlueColored'
        url = 'https://repo.bluecolored.de/releases'
    }
    maven {
        name = 'Jitpack'
        url = 'https://jitpack.io'
    }
    mavenCentral()
}

dependencies {
    // NeoForge is provided at runtime, only needed for compilation
    compileOnly 'net.neoforged:neoforge:21.1.217'
    
    // BlueMap API (provided at runtime, but needed for testing)
    compileOnly 'de.bluecolored.bluemap:BlueMapAPI:2.7.2'
    // For test runs, we can add it as testCompileOnly so it's available for tests
    testCompileOnly 'de.bluecolored.bluemap:BlueMapAPI:2.7.2'

    // BlueMap ships flow-math as a jar-in-jar module. Do NOT shade it into this mod —
    // that causes: Modules bluemapofflineplayermarkers and flow.math export package com.flowpowered.math
    compileOnly 'com.flowpowered:flow-math:1.0.3'
    
    // Utilities - these need to be shaded into the JAR
    // Exclude NeoForge transitive dependencies to avoid module conflicts
    implementation('com.technicjelle:UpdateChecker:2.5.1') {
        exclude group: 'io.netty'
        exclude group: 'net.neoforged'
        exclude group: 'cpw.mods'
    }
    implementation('com.technicjelle:BMUtils:4.2.1') {
        exclude group: 'io.netty'
        exclude group: 'net.neoforged'
        exclude group: 'cpw.mods'
    }
    implementation('com.technicjelle:MCUtils:2.0') {
        exclude group: 'io.netty'
        exclude group: 'net.neoforged'
        exclude group: 'cpw.mods'
    }
    
    // BlueNBT - provided by BlueMap at runtime, so we use compileOnly
    compileOnly 'de.bluecolored.bluenbt:BlueNBT:2.3.0'
    
    // Annotations
    implementation 'org.jetbrains:annotations:23.1.0'
    
    // Test dependencies (JUnit 4 for existing tests)
    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'org.hamcrest:hamcrest-core:1.3'
    // Vector3d is from flow-math, needed for tests
    testImplementation 'com.flowpowered:flow-math:1.0.3'
}

// Note: ASM is required by NeoForge but must be on module path, not classpath
// We only exclude it from shadow jar, not from runtime configurations

jar {
    manifest {
        attributes([
            'Specification-Title'     : project.name,
            'Specification-Vendor'    : 'TechnicJelle',
            'Specification-Version'   : project.version,
            'Implementation-Title'    : project.name,
            'Implementation-Vendor'  : 'TechnicJelle',
            'Implementation-Version' : project.version,
            'Multi-Release'          : 'false'
            // Note: We intentionally do NOT set Automatic-Module-Name
            // to prevent Java from treating this as a named module
            // Multi-Release: false also helps prevent module detection
        ])
    }
}

shadowJar {
    archiveClassifier = ''
    
    manifest {
        inheritFrom jar.manifest
        // Do not set Automatic-Module-Name to prevent module conflicts
        attributes('Multi-Release': 'false')
    }
    
    // Exclude NeoForge and BlueMap API (provided at runtime)
    exclude 'net/neoforged/**'
    exclude 'de/bluecolored/bluemap/**'
    // Exclude BlueNBT (provided by BlueMap at runtime)
    exclude 'de/bluecolored/bluenbt/**'
    
    // Exclude ASM from shadow jar (NeoForge provides it on module path)
    exclude 'org/objectweb/asm/**'
    exclude 'org/ow2/asm/**'
    
    // Exclude Mojang logging classes (conflicts with Minecraft's logging module)
    exclude 'com/mojang/logging/**'
    
    // Exclude Google packages that conflict with Minecraft's modules
    exclude 'com/google/errorprone/annotations/**'
    exclude 'com/google/gson/**'
    exclude 'com/google/common/**'
    
    // Exclude other packages that conflict with Minecraft's modules
    exclude 'net/minecrell/terminalconsole/**'
    exclude 'net/jodah/typetools/**'
    
    // Exclude Netty (provided by Minecraft)
    exclude 'io/netty/**'
    
    // Exclude Checker Framework (provided by Minecraft)
    exclude 'org/checkerframework/**'
    
    // Exclude Apache Maven (provided by Minecraft)
    exclude 'org/apache/maven/**'
    
    // Exclude javax.annotation (provided by Minecraft)
    exclude 'javax/annotation/**'
    
    // Exclude Log4j (provided by NeoForge)
    exclude 'org/apache/logging/log4j/**'
    
    // Exclude fastutil (provided by Minecraft)
    exclude 'it/unimi/dsi/fastutil/**'
    
    // Exclude ANTLR (provided by Minecraft)
    exclude 'org/antlr/**'
    
    // Exclude Mojang brigadier (provided by Minecraft)
    exclude 'com/mojang/brigadier/**'
    
    // Exclude Google J2ObjC annotations (provided by Minecraft)
    exclude 'com/google/j2objc/**'
    
    // Exclude NightConfig (provided by NeoForge)
    exclude 'com/electronwill/nightconfig/**'
    
    // Exclude JOML (provided by Minecraft)
    exclude 'org/joml/**'
    
    // Exclude SpongePowered Mixin tools (provided by NeoForge)
    exclude 'org/spongepowered/**'
    
    // Exclude JLine (provided by Minecraft)
    exclude 'org/jline/**'
    
    // Exclude JNA (provided by Minecraft)
    exclude 'com/sun/jna/**'
    
    // Exclude Plexus (provided by Minecraft)
    exclude 'org/codehaus/plexus/**'
    
    // Exclude Mojang authlib (provided by Minecraft)
    exclude 'com/mojang/authlib/**'
    
    // Exclude NeoForge FML earlydisplay (provided by NeoForge)
    exclude 'net/neoforged/fml/earlydisplay/**'
    
    // Exclude MachineZoo NoException (provided by Minecraft)
    exclude 'com/machinezoo/noexception/**'
    
    // Exclude cpw.mods packages (provided by NeoForge's securejarhandler module)
    exclude 'cpw/mods/**'
    
    // Exclude net.jpountz (provided by org.lz4.java module)
    exclude 'net/jpountz/**'
    
    // Exclude module-info files (they declare packages that conflict with runtime modules)
    exclude '**/module-info.class'
    // Exclude META-INF/services files that reference SpongePowered (causes module conflicts)
    exclude 'META-INF/services/org.spongepowered.*'
    
    // Exclude META-INF/maven entries for conflicting packages (but preserve our own)
    exclude 'META-INF/maven/com.google.code.gson/**'
    exclude 'META-INF/maven/com.google.j2objc/**'
    exclude 'META-INF/maven/com.mojang/**'
    exclude 'META-INF/maven/com.machinezoo/**'
    exclude 'META-INF/maven/com.sun.jna/**'
    exclude 'META-INF/maven/org.spongepowered/**'
    exclude 'META-INF/maven/net.neoforged/**'
    exclude 'META-INF/maven/cpw.mods/**'
    exclude 'META-INF/maven/net.jpountz/**'
    exclude 'META-INF/maven/io.netty/**'
    exclude 'META-INF/maven/net.jodah/**'
    
    // Exclude jarjar metadata (from Shadow plugin)
    exclude 'META-INF/jarjar/**'
    
    // Note: Relocation disabled due to Java 21 bytecode compatibility issues with Shadow plugin 8.1.1
    // If conflicts occur at runtime, consider updating Shadow plugin or using a different shading approach
    // relocate 'com.technicjelle.BMUtils', "${project.group}.${project.name}.shadow.BMUtils"
    // relocate 'com.technicjelle.MCUtils', "${project.group}.${project.name}.shadow.MCUtils"
    // relocate 'com.technicjelle.UpdateChecker', "${project.group}.${project.name}.shadow.UpdateChecker"
    // relocate 'org.bstats', "${project.group}.${project.name}.shadow.bstats"
    // relocate 'org.spongepowered.configurate', "${project.group}.${project.name}.shadow.configurate"
    
    configurations = [project.configurations.runtimeClasspath]
    
}

// Remove module-info.class files and conflicting packages from shadow JAR to avoid module conflicts
// This ensures the JAR is valid for NeoForge by removing conflicting packages while preserving essential mod files
tasks.named('shadowJar').get().doLast {
    def jarFile = tasks.shadowJar.archiveFile.get().asFile
    def tempFile = new File(jarFile.parentFile, "${jarFile.name}.tmp")
    
    def zipFile = new java.util.zip.ZipFile(jarFile)
    def outputStream = new java.util.zip.ZipOutputStream(new FileOutputStream(tempFile))
    
    // Track written entries to avoid duplicates
    def writtenEntries = new HashSet<String>()
    
    // Read manifest to modify it
    def manifest = null
    zipFile.entries().each { entry ->
        if (entry.name == 'META-INF/MANIFEST.MF') {
            manifest = new java.util.jar.Manifest(zipFile.getInputStream(entry))
        }
    }
    
    // Write modified manifest without Automatic-Module-Name
    // Remove it completely to prevent Java from treating this as a module
    // Also add Multi-Release: false to prevent module detection
    if (manifest != null) {
        def autoModuleName = new java.util.jar.Attributes.Name('Automatic-Module-Name')
        if (manifest.mainAttributes.containsKey(autoModuleName)) {
            manifest.mainAttributes.remove(autoModuleName)
        }
        // Ensure Multi-Release is false to prevent module path detection
        manifest.mainAttributes.putValue('Multi-Release', 'false')
        def manifestEntry = new java.util.zip.ZipEntry('META-INF/MANIFEST.MF')
        manifestEntry.setTime(System.currentTimeMillis())
        outputStream.putNextEntry(manifestEntry)
        manifest.write(outputStream)
        outputStream.closeEntry()
        writtenEntries.add('META-INF/MANIFEST.MF')
    }
    
    // Process all entries, ensuring mods.toml and mod classes are preserved
    zipFile.entries().each { entry ->
        // Skip if already written or if it's a directory
        if (writtenEntries.contains(entry.name) || entry.isDirectory()) {
            return
        }
        
        // ALWAYS preserve mods.toml - this is critical for NeoForge mod detection
        if (entry.name == 'META-INF/neoforge.mods/mods.toml') {
            def newEntry = new java.util.zip.ZipEntry(entry.name)
            newEntry.setTime(entry.getTime())
            outputStream.putNextEntry(newEntry)
            zipFile.getInputStream(entry).withStream { inputStream ->
                inputStream.transferTo(outputStream)
            }
            outputStream.closeEntry()
            writtenEntries.add(entry.name)
            return
        }
        
        // Exclude module-info.class files and META-INF files referencing conflicting packages
        // Also exclude class files from conflicting packages that are provided by runtime modules
        def shouldExclude = entry.name.contains('module-info.class') ||
                           entry.name.startsWith('META-INF/jarjar/') ||
                           // NeoForge packages (but preserve META-INF/neoforge.mods/)
                           (entry.name.contains('net/neoforged/') && 
                            !entry.name.startsWith('META-INF/neoforge.mods/')) ||
                           entry.name.contains('net/neoforged/fml/earlydisplay') ||
                           entry.name.contains('net/neoforged/fml/mclanguageprovider') ||
                           // cpw.mods packages
                           entry.name.contains('cpw/mods/') ||
                           // net.jpountz packages
                           entry.name.contains('net/jpountz/') ||
                           // net.jodah.typetools (provided by Minecraft)
                           entry.name.contains('net/jodah/typetools') ||
                           entry.name.startsWith('META-INF/maven/net.jodah') ||
                           // Netty (provided by Minecraft)
                           entry.name.contains('io/netty/') ||
                           entry.name.startsWith('META-INF/maven/io.netty') ||
                           // Google packages (provided by Minecraft) - but allow META-INF/maven entries for our own dependencies
                           entry.name.contains('com/google/errorprone/annotations') ||
                           (entry.name.contains('com/google/common/') && !entry.name.startsWith('META-INF/maven/com.technicjelle')) ||
                           (entry.name.contains('com/google/gson/') && !entry.name.startsWith('META-INF/maven/com.technicjelle')) ||
                           // Exclude META-INF/maven entries for conflicting packages only
                           (entry.name.startsWith('META-INF/maven/com.google') && 
                            !entry.name.contains('com.technicjelle')) ||
                           (entry.name.startsWith('META-INF/maven/com.mojang') && 
                            !entry.name.contains('com.technicjelle')) ||
                           (entry.name.startsWith('META-INF/maven/com.machinezoo') && 
                            !entry.name.contains('com.technicjelle')) ||
                           // Mojang packages (provided by Minecraft)
                           entry.name.contains('com/mojang/brigadier/') ||
                           entry.name.contains('com/mojang/logging/') ||
                           entry.name.contains('com/mojang/authlib/') ||
                           // Google J2ObjC annotations (provided by Minecraft)
                           entry.name.contains('com/google/j2objc/') ||
                           entry.name.startsWith('META-INF/maven/com.google.j2objc') ||
                           // JNA (provided by Minecraft)
                           entry.name.contains('com/sun/jna/') ||
                           entry.name.startsWith('META-INF/maven/com.sun.jna') ||
                           // SpongePowered (provided by NeoForge)
                           entry.name.contains('org/spongepowered/') ||
                           entry.name.startsWith('META-INF/maven/org.spongepowered') ||
                           // MachineZoo packages (provided by Minecraft)
                           entry.name.contains('com/machinezoo/noexception') ||
                           // META-INF services files that reference conflicting packages
                           (entry.name.startsWith('META-INF/services/') && 
                            (entry.name.contains('spongepowered') || 
                             entry.name.contains('org.spongepowered') ||
                             entry.name.contains('net.neoforged') ||
                             entry.name.contains('neoforged'))) ||
                           // Exclude META-INF files that might reference modules (but not mods.toml)
                           (entry.name.startsWith('META-INF/') && 
                            entry.name.contains('module') && 
                            !entry.name.contains('mods.toml'))
        
        if (!shouldExclude) {
            def newEntry = new java.util.zip.ZipEntry(entry.name)
            newEntry.setTime(entry.getTime())
            outputStream.putNextEntry(newEntry)
            zipFile.getInputStream(entry).withStream { inputStream ->
                inputStream.transferTo(outputStream)
            }
            outputStream.closeEntry()
            writtenEntries.add(entry.name)
        }
    }
    
    outputStream.close()
    zipFile.close()
    
    // Replace original with cleaned version
    if (jarFile.delete()) {
        tempFile.renameTo(jarFile)
        println "Cleaned JAR: Removed conflicting packages while preserving mod files"
    } else {
        throw new GradleException("Failed to replace JAR file")
    }
}

// Make the build task use shadowJar instead of regular jar (for distribution)
// But run tasks use the regular jar to avoid Shadow plugin interference
tasks.build.dependsOn shadowJar
tasks.assemble.dependsOn shadowJar

// runServer / runClient: do NOT use shadowJar (ASM module clash with NeoForge 9.8).
// Use plain jar + compile classpath with ASM stripped so NeoForge can own the module path.
tasks.matching { it.name.startsWith('run') }.configureEach {
    dependsOn.removeAll { dep ->
        def n = dep instanceof String ? dep : (dep.hasProperty('name') ? dep.name : dep.toString())
        n.toString().toLowerCase().contains('shadow')
    }
    // Prefer plain jar over shadow for local runs
    dependsOn 'jar'
    doFirst {
        def classpathFiles = classpath.files.findAll { file ->
            def name = file.name.toLowerCase()
            def path = file.path.toLowerCase().replace('\\', '/')
            // Strip all ASM jars (NeoForge puts ASM 9.8 on the module path)
            if (name.contains('asm-') || name == 'asm.jar') return false
            if (path.contains('/org/ow2/asm/') || path.contains('/org.ow2.asm/')) return false
            if (path.contains('/org/objectweb/asm/')) return false
            // Prefer project classes over the fat shadow jar on the run classpath
            if (name.startsWith('bluemapofflineplayermarkers') && name.endsWith('.jar')
                    && path.contains('/build/libs/')) {
                return false
            }
            return true
        }
        classpath = files(classpathFiles)
        logger.lifecycle("run classpath filtered: ${classpathFiles.size()} entries (ASM stripped for NeoForge)")
    }
}

// Documented alternative: package for production with `gradlew shadowJar` only.

// NeoForge userdev automatically handles NeoForm configuration

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        
        // Add mod dependencies for test runs
        modSource project.sourceSets.main
    }
    
    client {
        workingDirectory = project.file('run')
    }
    
    server {
        workingDirectory = project.file('run')
        
        // For server testing, we need BlueMap available
        // Note: BlueMap mod must be manually placed in run/mods/ before running
    }
}

// Configure test task (using JUnit 4)
tasks.named('test', Test) {
    useJUnit()
}

// Task to download BlueMap for testing (optional)
task downloadBlueMap(type: Exec) {
    description = 'Downloads BlueMap NeoForge mod for testing'
    group = 'setup'
    
    doFirst {
        println 'Note: Please manually download BlueMap NeoForge version and place it in run/mods/'
        println 'Download from: https://modrinth.com/mod/bluemap/version/latest'
        println 'Or: https://www.curseforge.com/minecraft/mc-mods/bluemap'
    }
}

