modLoader="javafml"
loaderVersion="[4,)"
license="MIT"
issueTrackerURL="https://github.com/imbavirus/BlueMapOfflinePlayerMarkers/issues"

[[mods]]
modId="bluemapofflineplayermarkers"
version="3.0"
displayName="BlueMap Skins 3D"
# Server-side mod: clients do not need it to join. Map UI is served by BlueMap's web app.
displayTest="IGNORE_SERVER_VERSION"
authors="TechnicJelle, Mark-255, Blue, Seercat3160, imbavirus"
credits="Based on BlueMap Offline Player Markers; NeoForge 3D skin UI"
displayURL="https://github.com/imbavirus/BlueMapOfflinePlayerMarkers"
description='''
BlueMap Skins 3D — full-body player skins on BlueMap.

Environment: Server-side (dedicated server or integrated server). Clients do not need this mod; the map is viewed in a browser via BlueMap.

Required dependencies:
- Minecraft 1.21.1
- NeoForge 21.1.217+
- BlueMap (NeoForge)

Features: online full-body models, greyscale offline markers, Offline label, in-map 3D/Offline toggles.
'''

# Minecraft
[[dependencies.bluemapofflineplayermarkers]]
modId="minecraft"
type="required"
versionRange="[1.21.1]"
ordering="NONE"
side="BOTH"

# NeoForge
[[dependencies.bluemapofflineplayermarkers]]
modId="neoforge"
type="required"
versionRange="[21.1.217,)"
ordering="NONE"
side="BOTH"

# BlueMap (markers + web assets) — must be present on the logical server
[[dependencies.bluemapofflineplayermarkers]]
modId="bluemap"
type="required"
versionRange="[5.0,)"
ordering="AFTER"
side="BOTH"
